[project]
name = "eda-mcp"
version = "0.1.0"
description = "Minimal MCP adapter for the EDA ExternalCall gRPC service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.81.0",
    "matplotlib>=3.10",
    "mcp>=1.0.0",
    "numpy>=2.0",
    "protobuf>=6.33.5",
    "python-dotenv>=1.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pytest>=8.0",
]
